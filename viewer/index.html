:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;--maxw:1180px;--measure:66ch;--r:4px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;line-height:1.14;margin:0;letter-spacing:-.012em;text-wrap:balance}
p{margin:0 0 var(--s4)}

strong{font-weight:600;color:var(--ink)}
mark{background:var(--accent-dim);color:inherit;padding:0 .15em;border-radius:2px}

ul,ol{margin:0 0 var(--s4);padding-left:1.2em}
li{margin-bottom:var(--s2)}

.skip:focus{left:8px;top:8px}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;color:#fff;background:var(--c,var(--ink-2));white-space:nowrap;line-height:1.5;vertical-align:1px}
.chip+.chip{margin-left:4px}

.yes{color:var(--ok)} .no{color:var(--bad)}
.ok,.bad,.warn,.flag{display:inline-flex;align-items:flex-start;gap:7px;font-family:var(--mono);font-size:12px;font-weight:600;line-height:1.45;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:3px}
.ok{background:var(--ok-dim);color:var(--ok)}
.bad{background:var(--bad-dim);color:var(--bad)}
.warn{background:var(--warn-dim);color:var(--warn)}

.muted{color:var(--ink-3);font-weight:400}
.c{font-family:var(--mono);font-size:.68em;font-weight:600;vertical-align:super;line-height:0;margin-left:1px}
.c a{border:0;padding:0 1px}
.c+.c{margin-left:2px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);margin:0 0 var(--s5)}

table th,table td{text-align:left;vertical-align:top;padding:var(--s4);border-bottom:1px solid var(--line)}
table thead th{position:sticky;top:0;background:var(--surface-2);border-bottom:2px solid var(--line-2);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;z-index:2}
table thead th.h-c{color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
table.cmp tbody th{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);width:180px;background:var(--surface)}
table tr:last-child th,table tr:last-child td{border-bottom:0}
table.data td{font-size:15px}
.demo{border:1px solid var(--line-2);background:var(--surface-2);border-radius:5px;overflow:hidden;margin:var(--s7) 0 0}
.secbody>.demo:first-child{margin-top:0}
.demo-head{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:var(--s3);align-items:baseline;justify-content:space-between}
.demo-head h3{font-size:20px;margin:0}

.demo-body{padding:var(--s6) var(--s5)}

.seg button:last-child{border-right:0}
.seg button:hover{background:var(--raise)}

.btnrow{display:flex;gap:var(--s3);align-items:center;margin-top:var(--s5);flex-wrap:wrap}

.btn-primary[disabled]{background:var(--line-2);color:var(--surface-2);cursor:default}

.cx-ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s5) var(--s6);margin-bottom:var(--s6)}
.cx-ctrl label,.cx-ctrl .clab{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:var(--s2)}

}
